<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterPrep Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #unity-loading-bar .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #4fc3f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #unity-loading-bar p {
            color: #aaa;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        #unity-progress-bar-empty {
            width: 150px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin: 8px auto;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: #4fc3f7;
            border-radius: 2px;
            transition: width 0.2s;
        }

        /* DEBUG OVERLAY — shows message stats on avatar */
        #debug-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 999;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div class="spinner"></div>
            <p>Loading Avatar...</p>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>

    <!-- DEBUG OVERLAY: shows if messages are reaching this iframe -->
    <div id="debug-overlay">
        Unity: loading...<br>
        Messages: 0 | State: idle
    </div>

    <script>
        // ============================================================
        // DEBUG TRACKING
        // ============================================================
        var debugStats = {
            unityLoaded: false,
            msgCount: 0,
            audioMsgCount: 0,
            stateMsgCount: 0,
            lastState: 'idle',
            lastVolume: 0,
            sendMessageErrors: 0,
            objectName: '699e0ce89853ea07673674d1'
        };

        function updateDebugOverlay() {
            var el = document.getElementById('debug-overlay');
            if (!el) return;
            el.innerHTML =
                'Unity: ' + (debugStats.unityLoaded ? '<span style="color:#0f0">✅ loaded</span>' : '<span style="color:#f00">⏳ loading</span>') + '<br>' +
                'Msgs: ' + debugStats.msgCount + ' (audio:' + debugStats.audioMsgCount + ' state:' + debugStats.stateMsgCount + ')<br>' +
                'State: ' + debugStats.lastState + ' | Vol: ' + debugStats.lastVolume.toFixed(4) + '<br>' +
                'Errors: ' + debugStats.sendMessageErrors + ' | Obj: ' + debugStats.objectName;
        }

        // Update overlay every 500ms
        setInterval(updateDebugOverlay, 500);

        // ============================================================
        // Unity WebGL Avatar Loader
        // ============================================================
        var unityInstance = null;
        var canvas = document.querySelector("#unity-canvas");

        // Unity build configuration
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/ok3.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/ok3.data",
            frameworkUrl: buildUrl + "/ok3.framework.js",
            codeUrl: buildUrl + "/ok3.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "InterPrep",
            productName: "InterPrep Avatar",
            productVersion: "1.0",
            showBanner: function (msg, type) {
                console.log("[Unity] " + type + ": " + msg);
            },
        };

        canvas.style.width = "100%";
        canvas.style.height = "100%";

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
            }).then((instance) => {
                unityInstance = instance;
                debugStats.unityLoaded = true;
                document.querySelector("#unity-loading-bar").style.display = "none";
                console.log("✅ Unity Avatar loaded successfully");

                // CRITICAL FIX: Override the baked-in mouthBlendShapeIndex (was 2, but mesh only has 0 and 1)
                // This prevents the "Array index (2) is out of bounds (size=2)" crash
                // Wait a short moment for Unity to finish initializing all components
                setTimeout(function() {
                    try {
                        // Set mouth blend shape to index 0 (safe fallback)
                        unityInstance.SendMessage(debugStats.objectName, 'SetMouthIndex', '0');
                        console.log("✅ [avatar.html] SetMouthIndex(0) sent to fix blend shape crash");
                        
                        // Set initial state to idle
                        unityInstance.SendMessage(debugStats.objectName, 'SetAvatarState', 'idle');
                        console.log("✅ [avatar.html] Initial state set to idle");
                    } catch(e) {
                        console.warn("⚠️ [avatar.html] Post-load init error (non-fatal):", e.message);
                    }
                }, 1000);

                // Notify parent that Unity is ready
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'unity-ready' }, '*');
                }
            }).catch((message) => {
                console.error("❌ Unity load error:", message);
                document.querySelector("#unity-loading-bar p").textContent = "Avatar load failed: " + message;
            });
        };
        script.onerror = () => {
            console.error("❌ Failed to load Unity loader script from: " + loaderUrl);
            document.querySelector("#unity-loading-bar p").textContent = "Failed to load Unity loader";
        };
        document.body.appendChild(script);

        // ============================================================
        // SAFE SendMessage wrapper — catches errors
        // ============================================================
        function safeSendMessage(objectName, methodName, param) {
            if (!unityInstance) return;
            try {
                unityInstance.SendMessage(objectName, methodName, param);
            } catch (e) {
                debugStats.sendMessageErrors++;
                console.error("❌ SendMessage error [" + objectName + "." + methodName + "]:", e.message);
            }
        }

        // ============================================================
        // Receive audio data from parent (Flutter/VAPI)
        // ============================================================
        window.addEventListener('message', function (event) {
            var data = event.data;
            if (!data || !data.type) return;

            debugStats.msgCount++;

            if (data.type === 'audio-level') {
                debugStats.audioMsgCount++;
                debugStats.lastVolume = data.volume || 0;

                if (!unityInstance) return;

                var objName = data.gameObject || debugStats.objectName;
                safeSendMessage(objName, 'ReceiveAudioLevel', JSON.stringify({
                    volume: data.volume || 0,
                    hf: data.hf || 0,
                    lf: data.lf || 0,
                    mf: data.mf || 0,
                    isSpeaking: data.isSpeaking || false
                }));
            }

            if (data.type === 'set-state') {
                debugStats.stateMsgCount++;
                debugStats.lastState = data.state || 'idle';
                console.log("🎭 [avatar.html] Received set-state:", data.state);

                if (!unityInstance) return;

                var objName = data.gameObject || debugStats.objectName;
                safeSendMessage(objName, 'SetAvatarState', data.state || 'idle');
            }
        });

        // ============================================================
        // Expose function for direct JS calls
        // ============================================================
        window.sendAudioToAvatar = function (volume, hf, lf, isSpeaking) {
            if (!unityInstance) return;
            safeSendMessage(debugStats.objectName, 'ReceiveAudioLevel',
                JSON.stringify({ volume: volume, hf: hf, lf: lf, mf: 0, isSpeaking: isSpeaking })
            );
        };

        console.log("🎭 [avatar.html] Script loaded, waiting for Unity...");
    </script>
</body>

</html>

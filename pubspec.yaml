name: interprep
description: A new Flutter project.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio packages
  audioplayers: ^5.2.1
  record: ^5.1.2

  cupertino_icons: ^1.0.8
  
  # Firebase packages - use compatible versions
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.2
  cloud_firestore: ^5.4.4
  
  # Other dependencies
  flutter_riverpod: ^2.5.1
  get: ^4.6.6
  dropdown_button2: ^2.3.9
  file_picker: ^8.1.2
  flutter_native_splash: ^2.4.1
  http: ^1.2.2
  fl_chart: ^0.69.0
  share_plus: ^10.0.2
  pdf: ^3.11.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  image_picker: ^1.0.0
  shared_preferences: ^2.2.2
  animations: ^2.0.11  # For page transitions
  shimmer: ^3.0.0      # For loading shimmer effects
  lottie: ^3.1.2       # For beautiful animations (optional)
  confetti: ^0.7.0
  flutter_slidable: ^3.0.1
  introduction_screen: ^3.1.14
  flutter_speed_dial: ^7.0.0
  cached_network_image: ^3.3.1
  cross_file: ^0.3.5+1
  syncfusion_flutter_pdf: ^33.1.47

dependency_overrides:
  web: ^1.1.0
  archive: ^3.6.1
  record_linux: ^1.0.0
  record_platform_interface: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/